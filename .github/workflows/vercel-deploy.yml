# Filet de déploiement Vercel (fallback), gaté par les tests E2E.
#
# NB (03/07/2026) : le canal de déploiement PRIMAIRE est désormais
# l'intégration Git native GitHub↔Vercel (déploiements `⎇ main`). Ce workflow
# ne sert plus que de FILET : il ne se déclenche qu'après le workflow
# « E2E Tests » et seulement s'il a réussi (cf. `if:` du job). Si le git natif
# est bien branché sur la team, ce fallback reste inactif (tests rouges → skip).
# Historiquement il existait pour contourner l'absence de la GitHub App Vercel.
#
# Cette GitHub Action reproduit `npx vercel deploy --prebuilt --prod` via le
# token Vercel.
#
# Pré-requis (secrets GitHub) :
#   VERCEL_TOKEN     : généré sur https://vercel.com/account/tokens
#                      (scope : Full Access, expiration : longue ou No expiration)
#   VERCEL_ORG_ID    : team_EABea3clj4h5wQbA0JIuIFF8   (team « SU » — MAJ post-transfert 03/07/2026)
#   VERCEL_PROJECT_ID: prj_v60RedBGprQZHZAPwCsOClOezcIf

name: Deploy to Vercel (production)

on:
  # GATE (Étape 0 refacto, finding H2) : le deploy ne part plus directement
  # sur push. Il se déclenche APRÈS le workflow « E2E Tests » (unit Jest +
  # build + Playwright) — et seulement si celui-ci a RÉUSSI (cf. `if:` du job
  # deploy). Un commit qui casse les tests ne va donc plus en prod.
  workflow_run:
    workflows: ["E2E Tests"]
    types: [completed]
    branches: [main]
  # Permet aussi de déclencher manuellement depuis l'UI GitHub Actions
  # (override d'urgence — bypass le gate en connaissance de cause).
  workflow_dispatch:

# Concurrence : un seul deploy à la fois. Si un push arrive pendant un
# deploy en cours, on annule le précédent et on prend le nouveau.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ne déploie que si les tests ont réussi (workflow_run.conclusion), OU
    # si déclenché manuellement (override assumé).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Anticipe le passage forcé à Node 24 le 2 juin 2026 sur les runners
      # GitHub. Évite un warning de deprecation sur actions/checkout@v4
      # et actions/setup-node@v4 qui tournent encore sur Node 20.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel CLI build, identique à un build sur la plateforme)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --archive=tgz : nécessaire car le build produit > 15 000 fichiers
      # (limite Vercel CLI). L'archive tgz est dépaquetée côté Vercel.
      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}

      - name: Output deploy URL
        run: echo "Production deploy live on https://volia.fr"
